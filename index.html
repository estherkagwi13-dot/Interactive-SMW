<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="style.css"
</head>
<body>
    <!-- 
 A dashboard displaying a welcome message and student statistics.
 A student registration form.
 A student records section displaying registered students.
 A student search feature.
 A student performance summary
    -->
 <section id="registration">
    <h2> Register A Student</h2>
    <form id="student-form">
        <label for="name">Full Name</label>
        <input type="text" id="name" placeholder="e.g Mary Ann">

        <label for="age">Age</label>
        <input type="number" id="age" placeholder="e.g 20">

        <label for="gender">Gender</label>
        <select id="gender">
            <option value="">-select-</option>
            <option value="Female">Female</option>
            <option value="Male">Male</option>
        </select>

        <label for="course">Course</label>
        <select id="course">
            <option value="">-Select-</option>
            <option value="Software Development">Software Development</option>
            <option value="Graphic Design">Graphic Design</option>
            <option value="Data Analysis">Data Analysis</option>
            <option value="Quality Analysis">Quality Analysis</option>
            <option value="Computer Science">Computer Science</option>
            <option value="Information Technology">Information Technology</option>
        </select>

        <label for="marks">Marks</label>
        <input type="number" id="marks" placeholder="e.g 99">

        <button type="submit">Register</button>
    </form>

    <p id="message"></p> <!--when the info is invalid results show here-->
 </section>
 <!--end of our student registration form-->
 </div>
 <script src="script.js"></script>
</body>
</html>
