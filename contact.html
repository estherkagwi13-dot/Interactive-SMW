    <h1>Contact Us</h1>
    <section id="contact">
        <h2>Get In Touch</h2>
        <p>Email: thisinstitute@gmail.com</p>
        <p>Phone: +254 1234 5678</p>
        <p>Location: Nyeri, Kenya</p>

        <form id="contact-form">
            <label for="contact-name">Your Name: </label>
            <input type="text" id="contact-name" placeholder="e.g Mary Ann">

            <label for="contact-email">Your Email: </label>
            <input type="text" id="contact-email" placeholder="e.g contact001@gmail.com">

            <label for="contact-message">Message: </label>
            <textarea id="contact-message" rows="5"></textarea>

            <button type="submit">Send Message</button>

        </form>
<!--will fill this section later-->
        <p id="contact-feedback"></p>
    </section>

    <script src="script.js"></script>
